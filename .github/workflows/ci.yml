name: CI & Deploy

on:
  push:
    # 'chore/**' matters: PRs opened by a workflow using GITHUB_TOKEN do not
    # trigger CI, so the vendor-update branch would otherwise sit untested.
    branches: [main, 'chore/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # the attribution gate scans the whole history, not just the tip
          fetch-depth: 0

      # A commit-msg hook on the dev hosts refuses an AI attribution trailer,
      # but `--no-verify` walks straight past it. This is the wall: `deploy`
      # needs `test`, so a trailered commit cannot reach the live site however
      # it was made.
      - name: No AI attribution in any commit
        run: |
          set -u
          PAT='co-authored-by:[[:space:]]*claude|generated with .?claude|claude[.]com/claude-code|noreply@anthropic[.]com'

          # A scan that cannot detect is not a scan. The first draft of this
          # step used `git log -iE`; git rejected the flag, the empty output
          # read as clean, and a planted commit sailed through. So the gate
          # proves its own detector before it may report clean.
          if ! echo 'Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>' | grep -qiE "$PAT"; then
            echo "::error::gate self-test failed - the pattern detects nothing"; exit 1
          fi
          if echo 'Co-authored-by: dependabot[bot] <1+dependabot[bot]@users.noreply.github.com>' | grep -qiE "$PAT"; then
            echo "::error::gate self-test failed - the pattern matches dependabot"; exit 1
          fi

          if ! HITS=$(git log --regexp-ignore-case --extended-regexp --grep="$PAT" --format='%h  %an  %s'); then
            echo "::error::the attribution scan could not run"; exit 1
          fi
          if [ -n "$HITS" ]; then
            echo "::error::a commit carries an AI attribution trailer - the deploy is blocked"
            echo "$HITS"
            exit 1
          fi
          echo "clean: $(git rev-list --count HEAD) commits scanned, none carrying AI attribution"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the complete suite
        run: npm test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble dist
        run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Post-deploy smoke — the live domain must serve THIS build
        run: |
          set -e
          URL="https://aletheiainstitute.ai"
          REF=$(grep -o 'css/main.css?v=[a-f0-9]*' dist/index.html | head -1)
          echo "expecting: $REF"
          LIVE=""
          for i in $(seq 1 18); do
            LIVE=$(curl -s "$URL/" | grep -o 'css/main.css?v=[a-f0-9]*' | head -1 || true)
            [ "$LIVE" = "$REF" ] && break
            echo "poll $i: served '$LIVE' — waiting for CDN…"; sleep 10
          done
          [ "$LIVE" = "$REF" ] || { echo "FAIL: live HTML never matched this build"; exit 1; }
          for a in $(grep -ohE '(css|js|assets)/[^"?]+\?v=[a-f0-9]+' dist/index.html dist/manifesto/index.html dist/privacy/index.html dist/terms/index.html | sort -u); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/$a")
            echo "$code  $a"
            [ "$code" = "200" ] || { echo "FAIL: hashed asset not serving"; exit 1; }
          done
          # The legal URLs are what a carrier fetches during A2P review.
          # If either stops serving, the campaign behind it stops too.
          # The manifesto is the page people are sent to read. Same rule.
          for p in /manifesto/ /privacy/ /terms/; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL$p")
            echo "$code  $p"
            [ "$code" = "200" ] || { echo "FAIL: $p is not serving"; exit 1; }
          done
          echo "SMOKE PASS: live HTML, hashed assets and legal URLs are this build, atomically."
